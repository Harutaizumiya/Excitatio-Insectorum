services:
  server:
    image: excitatio-insectorum-server:latest
    container_name: excitatio-insectorum-server
    restart: unless-stopped
    env_file:
      - ./server.env
    command:
      - sh
      - -c
      - export PATH=/app/packages/database/node_modules/.bin:/app/node_modules/.bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin && node packages/database/scripts/run-sqlite-prisma.mjs migrate deploy --schema prisma/sqlite/schema.prisma && node apps/server/dist/main.js
    volumes:
      - ./data/sqlite/dev.db:/app/packages/database/prisma/sqlite/dev.db
    ports:
      - '127.0.0.1:3000:3000'
    networks:
      - panel

networks:
  panel:
    external: true
    name: 1panel-network
