packages:
  - 'apps/web'
  - 'apps/teacher-miniprogram'
  - 'apps/server-elysia'
  - 'packages/*'

allowBuilds:
  '@parcel/watcher': true
  '@prisma/client': true
  '@prisma/engines': true
  '@scarf/scarf': true
  '@swc/core': true
  '@tarojs/binding': true
  '@tarojs/cli': true
  esbuild: true
  micromark: false
  node-pty: false
  prisma: true

onlyBuiltDependencies:
  - '@prisma/client'
  - '@prisma/engines'
  - 'prisma'
  - '@scarf/scarf'
  - 'bcryptjs'
  - 'micromark'
  - 'esbuild'
